spring.application.name=petcare
server.port=8080

# ---------------------------------------------------------------
# Base de datos MySQL (levantada con docker-compose)
# Se pueden sobreescribir con variables de entorno DB_URL, DB_USER, DB_PASS
# ---------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/petcare?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USER:petcare}
spring.datasource.password=${DB_PASS:petcare123}

# Las tablas las crean database/schema.sql y database/data.sql (no Hibernate)
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.time-zone=America/Santiago

# ---------------------------------------------------------------
# API externa en Node (segundo equipo de la red)
# Cambiar localhost por la IP del otro equipo, ej: http://192.168.1.50:3000
# o definir la variable de entorno API_EXTERNA_URL
# ---------------------------------------------------------------
petcare.api-externa.url=${API_EXTERNA_URL:http://localhost:3000}
petcare.api-externa.timeout-ms=5000

# Horario de atención (bloques de 1 hora: 09:00, 10:00 ... 17:00)
petcare.horario.hora-inicio=9
petcare.horario.hora-fin=18

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
